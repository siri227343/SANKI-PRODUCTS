<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SANKI PRODUCTS</title>
    <style>
      :root {
        --primary: #b22222;
        --dark: #1f1f1f;
        --light: #f7f7f7;
        --card: #fffdfa;
        --muted: #666;
        --accent: #f4d35e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #fffaf0, #fff);
        color: var(--dark);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 20px 80px;
      }

      .hero {
        text-align: center;
        padding: 32px 16px 20px;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(2.2rem, 4vw, 4rem);
        color: var(--primary);
        letter-spacing: 1px;
      }

      .hero p {
        max-width: 700px;
        margin: 12px auto 0;
        font-size: 1.05rem;
        color: var(--muted);
      }

      .top-bar {
        display: flex;
        justify-content: center;
        margin: 20px 0 32px;
      }

      .order-button {
        display: inline-block;
        background: #25d366;
        color: white;
        text-decoration: none;
        padding: 14px 26px;
        border-radius: 999px;
        font-weight: bold;
        box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
      }

      .products {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 24px;
      }

      .product-card {
        background: var(--card);
        border: 1px solid #f0e7dc;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      }

      .product-card img {
        width: 100%;
        height: 230px;
        object-fit: cover;
        display: block;
      }

      .content {
        padding: 18px 18px 20px;
      }

      .content h3 {
        margin: 0 0 12px;
        font-size: 1.1rem;
        min-height: 48px;
      }

      .pack {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 0.96rem;
      }

      .price-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .price {
        font-size: 1.5rem;
        font-weight: bold;
        color: var(--primary);
      }

      .order-btn {
        background: var(--primary);
        color: #fff;
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 999px;
        font-weight: bold;
      }

      .floating-whatsapp {
        position: fixed;
        right: 22px;
        bottom: 22px;
        width: 62px;
        height: 62px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #25d366;
        color: #fff;
        text-decoration: none;
        font-size: 2rem;
        box-shadow: 0 10px 24px rgba(37, 211, 102, 0.45);
      }

      @media (max-width: 600px) {
        .container {
          padding-left: 14px;
          padding-right: 14px;
        }

        .price-row {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="hero">
        <h1>SANKI PRODUCTS</h1>
        <p>Fresh, trusted essentials for your kitchen and daily needs.</p>
      </header>

      <div class="top-bar">
        <a id="whatsapp-button" class="order-button" href="#" target="_blank" rel="noopener noreferrer">WhatsApp Order</a>
      </div>

      <main id="product-list" class="products"></main>
    </div>

    <a id="floating-whatsapp" class="floating-whatsapp" href="#" target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp">WhatsApp</a>

    <script src="script.js"></script>
  </body>
</html>
